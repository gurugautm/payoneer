trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  imageRepository: local/nginx-custom
  imageTag: $(Build.BuildId)
  imageTarDirectory: $(Build.ArtifactStagingDirectory)/docker-image
  imageTarPath: $(imageTarDirectory)/nginx-custom-$(Build.BuildId).tar

steps:
  - checkout: self

  - bash: |
      set -euo pipefail

      docker build \
        --pull \
        --build-arg BUILD_ID="$(Build.BuildId)" \
        --tag "$(imageRepository):$(imageTag)" \
        --file - \
        . <<'DOCKERFILE'
      FROM nginx:1.22
      ARG BUILD_ID
      LABEL org.opencontainers.image.title="nginx-custom" \
            org.opencontainers.image.base.name="docker.io/library/nginx:1.22" \
            org.opencontainers.image.revision="$BUILD_ID"
      DOCKERFILE

      docker image inspect "$(imageRepository):$(imageTag)"
    displayName: Build image from nginx:1.22

  - bash: |
      set -euo pipefail

      mkdir -p "$(imageTarDirectory)"
      docker image save \
        --output "$(imageTarPath)" \
        "$(imageRepository):$(imageTag)"

      test -s "$(imageTarPath)"
      ls -lh "$(imageTarPath)"
    displayName: Export image to TAR

  # Replace this step with your Aqua scanner command. The TAR file is available
  # at $(imageTarPath), and a scan failure should return a non-zero exit code.
  - bash: |
      set -euo pipefail
      echo "Aqua scan target: $(imageTarPath)"
      # aqua-scanner <your-options> "$(imageTarPath)"
    displayName: Aqua scan placeholder

  - task: PublishPipelineArtifact@1
    displayName: Publish image TAR
    inputs:
      targetPath: $(imageTarDirectory)
      artifact: nginx-image-tar
      publishLocation: pipeline




