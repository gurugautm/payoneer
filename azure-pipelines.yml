trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # 1. Build the Docker image
  - bash: |
      set -euo pipefail

      IMAGE_NAME="local/nginx-custom"
      IMAGE_TAG="${BUILD_BUILDID}"
      FULL_IMAGE_NAME="${IMAGE_NAME}:${IMAGE_TAG}"

      echo "Building ${FULL_IMAGE_NAME}"

      docker build \
        --pull \
        --build-arg BUILD_ID="${BUILD_BUILDID}" \
        --tag "${FULL_IMAGE_NAME}" \
        --file - \
        . <<'DOCKERFILE'
      FROM nginx:1.22
      ARG BUILD_ID
      LABEL org.opencontainers.image.title="nginx-custom" \
            org.opencontainers.image.base.name="docker.io/library/nginx:1.22" \
            org.opencontainers.image.revision="${BUILD_ID}"
      DOCKERFILE

      docker image inspect "${FULL_IMAGE_NAME}"
    displayName: 'Build Docker image'

  # 2. Export the image before Aqua scanning
  - bash: |
      set -euo pipefail

      IMAGE_NAME="local/nginx-custom"
      IMAGE_TAG="${BUILD_BUILDID}"
      FULL_IMAGE_NAME="${IMAGE_NAME}:${IMAGE_TAG}"

      TAR_DIRECTORY="${BUILD_ARTIFACTSTAGINGDIRECTORY}/docker-image"
      TAR_PATH="${TAR_DIRECTORY}/nginx-custom-${BUILD_BUILDID}.tar"

      mkdir -p "${TAR_DIRECTORY}"

      wget \
        --quiet \
        --output-document="${SCANNER_PATH}" \
        --user  hitesh.kumar@aquasec.com --password 09@ERNit-021 "https://download.aquasec.com/scanner/2607.3.5/scannercli"

      chmod +x "${SCANNER_PATH}"

      "${SCANNER_PATH}" scan \
        --dockerless \
        --token "353b4670a640b442dc49dff675a251948760940c932c4d2aa8795649776755c7" \
        --host "https://11d572ce2e.cloud.aquasec.com" \
        --register \
        --registry "guru-acr" \
        --no-verify \
        --show-will-not-fix \
        --text \
        --jsonfile "${OUTPUT_DIRECTORY}/aqua_output.json" \
        --htmlfile "${OUTPUT_DIRECTORY}/aqua_output.html" \
        --docker-archive "${TAR_PATH}" \
        "${IMAGE_NAME}:${IMAGE_TAG}"

      docker image save \
        --output "${TAR_PATH}" \
        "${FULL_IMAGE_NAME}"

      test -s "${TAR_PATH}"
      ls -lh "${TAR_PATH}"
    displayName: 'Export image to TAR'

  # 3. Authenticate to pull the Aqua scanner container
