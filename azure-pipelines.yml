steps:
  - checkout: self

  # 1. Build Docker image
  - bash: |
      set -euo pipefail

      docker build \
        --pull \
        --build-arg BUILD_ID="$(Build.BuildId)" \
        --tag "$(imageRepository):$(imageTag)" \
        --file - \
        . <<'DOCKERFILE'
      FROM nginx:1.22
      ARG BUILD_ID
      LABEL org.opencontainers.image.title="nginx-custom" \
            org.opencontainers.image.base.name="docker.io/library/nginx:1.22" \
            org.opencontainers.image.revision="$BUILD_ID"
      DOCKERFILE

      docker image inspect "$(imageRepository):$(imageTag)"
    displayName: 'Build Docker image'

  # 2. Export image to TAR
  - bash: |
      set -euo pipefail

      mkdir -p "$(imageTarDirectory)"

      docker image save \
        --output "$(imageTarPath)" \
        "$(imageRepository):$(imageTag)"

      test -s "$(imageTarPath)"
      ls -lh "$(imageTarPath)"
    displayName: 'Export image to TAR'

  # 3. Log in so the Aqua scanner container can be pulled
  - task: Docker@2
    displayName: 'Log in to Aqua registry'
    inputs:
      containerRegistry: 'login aqua'
      command: 'login'

  # 4. Scan the already-built local Docker image
  - task: aquasecScanner@4
    displayName: 'Aqua scan local Docker image'
    inputs:
      image: '$(imageRepository):$(imageTag)'
      scanType: 'local'
      containerRuntime: 'docker'
      scanner: 'registry.aquasec.com/scanner:2022.4.860'
      connection: 'guru-host'
      registry: 'guru-acr'
      register: true

  # 5. Publish TAR after a successful scan
  - task: PublishPipelineArtifact@1
    displayName: 'Publish image TAR'
    inputs:
      targetPath: '$(imageTarDirectory)'
      artifact: 'nginx-image-tar'
      publishLocation: 'pipeline'