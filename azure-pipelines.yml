trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self

  # 1. Build using the Dockerfile in the repository
  - task: Bash@3
    displayName: 'Build Docker image'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        IMAGE_NAME="local/python-app"
        IMAGE_TAG="${BUILD_BUILDID}"
        FULL_IMAGE_NAME="${IMAGE_NAME}:${IMAGE_TAG}"

        echo "Building ${FULL_IMAGE_NAME}"

        docker build \
          --pull \
          --tag "${FULL_IMAGE_NAME}" \
          --file "${BUILD_SOURCESDIRECTORY}/Dockerfile" \
          "${BUILD_SOURCESDIRECTORY}"

        docker image inspect "${FULL_IMAGE_NAME}"

  # 2. Save the image as a TAR before scanning
  - task: Bash@3
    displayName: 'Export Docker image to TAR'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        IMAGE_NAME="local/python-app"
        IMAGE_TAG="${BUILD_BUILDID}"
        FULL_IMAGE_NAME="${IMAGE_NAME}:${IMAGE_TAG}"

        TAR_DIRECTORY="${BUILD_ARTIFACTSTAGINGDIRECTORY}/docker-image"
        TAR_PATH="${TAR_DIRECTORY}/python-app-${BUILD_BUILDID}.tar"

        mkdir -p "${TAR_DIRECTORY}"

        echo "Exporting ${FULL_IMAGE_NAME} to ${TAR_PATH}"

        docker save \
          --output "${TAR_PATH}" \
          "${FULL_IMAGE_NAME}"

        test -s "${TAR_PATH}"
        ls -lh "${TAR_PATH}"

  # 3. Download scannercli and scan the TAR
  - task: Bash@3
    displayName: 'Scan Docker TAR with Aqua scannercli'
    inputs:
      targetType: inline
      script: |
        set -euo pipefail

        IMAGE_NAME="local/python-app"
        IMAGE_TAG="${BUILD_BUILDID}"
        FULL_IMAGE_NAME="${IMAGE_NAME}:${IMAGE_TAG}"

        TAR_PATH="${BUILD_ARTIFACTSTAGINGDIRECTORY}/docker-image/python-app-${BUILD_BUILDID}.tar"
        SCANNER_PATH="${AGENT_TEMPDIRECTORY}/scannercli"
        OUTPUT_DIRECTORY="${BUILD_ARTIFACTSTAGINGDIRECTORY}/aqua-reports"

        : "${AQUA_DOWNLOAD_USER:?AQUA_DOWNLOAD_USER is required}"
        : "${AQUA_DOWNLOAD_PASSWORD:?AQUA_DOWNLOAD_PASSWORD is required}"
        : "${AQUA_TOKEN:?AQUA_TOKEN is required}"

        test -s "${TAR_PATH}"
        mkdir -p "${OUTPUT_DIRECTORY}"

        wget \
          --quiet \
          --user="hitesh.kumar@aquasec.com" \
          --password="09@ERNit-021" \
          --output-document="${SCANNER_PATH}" \
          "https://download.aquasec.com/scanner/2607.3.5/scannercli"

        chmod +x "${SCANNER_PATH}"

        "${SCANNER_PATH}" scan \
          --dockerless \
          --token "353b4670a640b442dc49dff675a251948760940c932c4d2aa8795649776755c7" \
          --host "https://11d572ce2e.cloud.aquasec.com" \
          --register \
          --registry "kolin-hap-VKS" \
          --no-verify \
          --show-will-not-fix \
          --text \
          --policies guru-acr \
          --jsonfile "${OUTPUT_DIRECTORY}/aqua_output.json" \
          --htmlfile "${OUTPUT_DIRECTORY}/aqua_output.html" \
          --docker-archive "${TAR_PATH}" \
          "${FULL_IMAGE_NAME}"
    env:
      AQUA_DOWNLOAD_USER: $(AQUA_DOWNLOAD_USER)
      AQUA_DOWNLOAD_PASSWORD: $(AQUA_DOWNLOAD_PASSWORD)
      AQUA_TOKEN: $(AQUA_TOKEN)

  # 4. Publish the saved Docker image
  - task: PublishPipelineArtifact@1
    displayName: 'Publish image TAR'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/docker-image'
      artifact: 'python-image-tar'
      publishLocation: pipeline

  # 5. Publish Aqua reports
  - task: PublishPipelineArtifact@1
    displayName: 'Publish Aqua scan reports'
    condition: succeededOrFailed()
    inputs:
      targetPath: '$(Build.ArtifactStagingDirectory)/aqua-reports'
      artifact: 'aqua-scan-reports'
      publishLocation: pipeline